[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2.12.7"
tauri-build = "2.7.6"
ts-rs = "12.0.1"
vault-core = { path = "crates/vault-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# "Errors are handled, not hidden": never panic on user data. Tests may (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
