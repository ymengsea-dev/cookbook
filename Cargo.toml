[workspace]
resolver = "3"
members = ["backend/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
blake3 = "1.8.7"
notify = "9.0.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tauri = { version = "2.12.7", features = ["protocol-asset"] }
tauri-build = "2.7.6"
tauri-plugin-dialog = "2.8.4"
tempfile = "3.27.0"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
ulid = "3.0.0"
vault-core = { path = "backend/vault-core" }
vault-index = { path = "backend/vault-index" }
vault-run = { path = "backend/vault-run" }
vault-views = { path = "backend/vault-views" }
yaml-rust2 = "0.13.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# "Errors are handled, not hidden": never panic on user data. Tests may (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
